<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hambo's Time Fighter</title>
<style>
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    background:#000;font-family:monospace;touch-action:none;
  }
  body{display:flex;align-items:center;justify-content:center}
  canvas{
    display:block;width:100vw;height:100vh;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#4cc8ff;
  }
  #hint{
    position:fixed;left:50%;bottom:5px;transform:translateX(-50%);
    color:#fff;font:bold 9px monospace;text-align:center;
    text-shadow:2px 2px #000;pointer-events:none;
    z-index:5;
  }
  #controls{
    position:fixed;inset:0;pointer-events:none;z-index:10;
  }
  #joystick{
    position:absolute;left:18px;bottom:18px;width:76px;height:76px;
    border:3px solid rgba(255,255,255,.8);background:rgba(0,0,0,.18);
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.18);
    border-radius:50%;pointer-events:auto;
  }
  #stick{
    position:absolute;left:23px;top:23px;width:30px;height:30px;
    border:3px solid #111;background:#eee;border-radius:50%;
    box-shadow:3px 3px 0 #111;
  }
  #fire{
    position:absolute;right:22px;bottom:24px;width:78px;height:78px;
    border:4px solid #111;background:#e63b32;color:#fff;
    border-radius:50%;font:bold 13px monospace;
    box-shadow:4px 4px 0 #111;pointer-events:auto;
    -webkit-user-select:none;user-select:none;
  }
  #fire:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #111}
</style>
</head>
<body>
<canvas id="game" width="320" height="180"></canvas>
<div id="controls">
  <div id="joystick"><div id="stick"></div></div>
  <button id="fire">FIRE</button>
</div>
<div id="hint">TAP THE SCREEN TO START</div>

<script>
"use strict";

const c=document.getElementById("game");
const ctx=c.getContext("2d");
ctx.imageSmoothingEnabled=false;

const VW=320,VH=180;
let state="home";
let player,enemies,shots,enemyShots,particles;
let score=0,wave=1,lives=3,last=0,spawnTimer=0;
let joystick={active:false,x:0,y:0};
let fireHeld=false;
let audioCtx=null;

const keys={};
addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))
    e.preventDefault();
  if(e.key==="Enter" && state!=="play") startGame();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function initAudio(){
  if(!audioCtx){
    try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
}
function tone(freq,duration,type="square",volume=.045,slide=0){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(40,freq+slide),audioCtx.currentTime+duration);
  g.gain.setValueAtTime(volume,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);
}
function sfxStart(){tone(330,.08,"square",.05,100);setTimeout(()=>tone(494,.08,"square",.05,120),80);setTimeout(()=>tone(659,.12,"square",.05),160)}
function sfxShoot(){tone(760,.045,"square",.035,-360)}
function sfxSmall(){tone(220,.08,"square",.055,-110);setTimeout(()=>tone(110,.09,"square",.04,-50),30)}
function sfxBig(){tone(150,.16,"square",.065,-90);setTimeout(()=>tone(75,.18,"square",.05,-30),55)}
function sfxHit(){tone(95,.12,"sawtooth",.05,-50)}

function startGame(){
  initAudio();sfxStart();
  const h=document.getElementById("hint"); if(h) h.style.display="none";
  player={x:160,y:126,dx:0,dy:-1,cool:0,inv:1.2};
  enemies=[];shots=[];enemyShots=[];particles=[];
  score=0;wave=1;lives=3;spawnTimer=.35;state="play";
}
function goHome(){const h=document.getElementById("hint"); if(h) h.style.display="block"; state="home";enemies=[];shots=[];enemyShots=[];particles=[]}
function gameOver(){state="over";sfxBig()}

function burst(x,y,big=false){
  const count=big?20:10;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=(big?20:14)+Math.random()*45;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.4,big});
  }
}

function shoot(){
  if(state!=="play" || player.cool>0)return;
  player.cool=.18;
  const dx=player.dx,dy=player.dy;
  shots.push({x:player.x+dx*7,y:player.y+dy*7,vx:dx*145,vy:dy*145,life:1.4});
  sfxShoot();
}

function spawnEnemy(){
  if(enemies.length>=5)return;
  const big=Math.random()<Math.min(.12+wave*.015,.35);
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=-12;y=15+Math.random()*120}
  if(side===1){x=332;y=15+Math.random()*120}
  if(side===2){x=20+Math.random()*280;y=-12}
  if(side===3){x=20+Math.random()*280;y=192}
  const speed=(big?27:38)+wave*1.4;
  enemies.push({
    x,y,big,
    r:big?9:6,
    hp:big?3:1,
    speed,
    angle:Math.random()*Math.PI*2,
    turn:0,
    shoot:.9+Math.random()*1.8
  });
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function hitPlayer(){
  if(player.inv>0)return;
  lives--;
  player.inv=1.6;
  player.x=160;player.y=126;
  burst(player.x,player.y,true);
  sfxHit();
  if(lives<=0)gameOver();
}

function update(dt){
  // The sky scrolls downward in draw(), creating the sensation of forward flight.
  if(state!=="play"){
    for(const p of particles){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    }
    particles=particles.filter(p=>p.life>0);
    return;
  }

  player.cool-=dt;player.inv-=dt;

  let ax=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let ay=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);

  if(joystick.active){
    ax=joystick.x;ay=joystick.y;
  }

  if(ax||ay){
    const m=Math.hypot(ax,ay);
    ax/=m;ay/=m;
    player.x+=ax*78*dt;
    player.y+=ay*78*dt;
    player.dx=ax;player.dy=ay;
  }

  player.x=clamp(player.x,10,310);
  player.y=clamp(player.y,25,170);

  if(keys[" "]||keys.f||fireHeld)shoot();

  spawnTimer-=dt;
  if(spawnTimer<=0){
    if(enemies.length<5)spawnEnemy();
    spawnTimer=Math.max(.45,1.05-wave*.035);
  }

  for(const s of shots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  }
  shots=shots.filter(s=>s.life>0&&s.x>-20&&s.x<340&&s.y>-20&&s.y<200);

  for(const e of enemies){
    const target=Math.atan2(player.y-e.y,player.x-e.x);
    let diff=Math.atan2(Math.sin(target-e.angle),Math.cos(target-e.angle));
    e.angle+=clamp(diff,-2.2*dt,2.2*dt);
    e.x+=Math.cos(e.angle)*e.speed*dt;
    e.y+=Math.sin(e.angle)*e.speed*dt;
    e.shoot-=dt;

    if(e.shoot<=0){
      e.shoot=1.5+Math.random()*1.7;
      const dx=Math.cos(e.angle),dy=Math.sin(e.angle);
      enemyShots.push({x:e.x,y:e.y,vx:dx*(55+wave*2),vy:dy*(55+wave*2),life:4});
    }
  }

  for(const s of enemyShots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  }
  enemyShots=enemyShots.filter(s=>s.life>0&&s.x>-20&&s.x<340&&s.y>-20&&s.y<200);

  for(let i=enemies.length-1;i>=0;i--){
    let destroyed=false;
    for(let j=shots.length-1;j>=0;j--){
      if(distance(enemies[i],shots[j])<enemies[i].r+3){
        enemies[i].hp--;
        shots.splice(j,1);
        burst(enemies[i].x,enemies[i].y,enemies[i].big);
        if(enemies[i].hp<=0){
          score+=enemies[i].big?500:100;
          enemies.splice(i,1);
          if(score>=wave*1000)wave=Math.min(20,wave+1);
          if(enemies[i]){} // keeps the loop simple after splice
          destroyed=true;
        }
        break;
      }
    }
    if(destroyed)continue;
  }

  if(player.inv<=0){
    for(const s of enemyShots){
      if(distance(player,s)<7){s.life=0;hitPlayer();break}
    }
    for(const e of enemies){
      if(distance(player,e)<7+e.r){
        e.x=-999;hitPlayer();break;
      }
    }
  }

  enemyShots=enemyShots.filter(s=>s.life>0);
  enemies=enemies.filter(e=>e.x>-30&&e.x<350&&e.y>-30&&e.y<210);

  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=.94;p.vy*=.94;p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);
}

// Pixel-art sky layers. The offsets continuously move to sell the flying effect.
let skyScroll=0;
let cloudScroll=0;
function drawSky(dt){
  skyScroll=(skyScroll+dt*22)%180;
  cloudScroll=(cloudScroll+dt*12)%220;

  ctx.fillStyle="#45c9ff";ctx.fillRect(0,0,VW,VH);

  // distant tiny cloud streaks
  ctx.fillStyle="#bceeff";
  for(let i=0;i<12;i++){
    let y=(i*31+skyScroll*.45)%190-10;
    let x=(i*67+Math.floor(cloudScroll*.35))%350-20;
    ctx.fillRect(x,y,18,3);
    ctx.fillRect(x+5,y-2,10,3);
  }

  // big foreground pixel clouds, moving faster downward
  for(let i=0;i<7;i++){
    let y=(i*47+cloudScroll)%215-25;
    let x=(i*83+Math.floor(cloudScroll*.25))%350-30;
    drawCloud(x,y, i%3===0?1.0:.75);
  }
}
function drawCloud(x,y,s){
  x=Math.round(x);y=Math.round(y);
  ctx.fillStyle="#fff";
  ctx.fillRect(x,y+8*s,34*s,8*s);
  ctx.fillRect(x+5*s,y+4*s,24*s,10*s);
  ctx.fillRect(x+12*s,y,12*s,14*s);
  ctx.fillStyle="#e7f8ff";
  ctx.fillRect(x+3*s,y+13*s,28*s,4*s);
}

function drawPlayer(){
  const x=Math.round(player.x),y=Math.round(player.y);
  ctx.save();ctx.translate(x,y);
  ctx.rotate(Math.atan2(player.dy,player.dx)+Math.PI/2);

  // black outline
  ctx.fillStyle="#111";
  ctx.fillRect(-3,-9,6,18);
  ctx.fillRect(-8,-3,16,5);
  ctx.fillRect(-5,4,10,4);

  // white 8-bit aircraft
  ctx.fillStyle="#fff";
  ctx.fillRect(-2,-8,4,16);
  ctx.fillRect(-7,-2,14,3);
  ctx.fillRect(-4,4,8,3);

  // cockpit + tail pixels
  ctx.fillStyle="#69c7ff";ctx.fillRect(-1,-5,2,4);
  ctx.fillStyle="#222";ctx.fillRect(-2,7,4,2);
  ctx.restore();
}

function drawEnemy(e){
  const x=Math.round(e.x),y=Math.round(e.y);
  ctx.save();ctx.translate(x,y);
  ctx.rotate(e.angle+Math.PI/2);

  if(e.big){
    // large green enemy
    ctx.fillStyle="#102b16";
    ctx.fillRect(-5,-12,10,24);
    ctx.fillRect(-12,-4,24,6);
    ctx.fillRect(-8,6,16,5);
    ctx.fillStyle="#25a63b";
    ctx.fillRect(-3,-10,6,20);
    ctx.fillRect(-10,-3,20,4);
    ctx.fillRect(-6,6,12,3);
    ctx.fillStyle="#8bea63";ctx.fillRect(-2,-7,4,4);
  }else{
    // small green enemy
    ctx.fillStyle="#102b16";
    ctx.fillRect(-3,-8,6,16);
    ctx.fillRect(-8,-2,16,4);
    ctx.fillRect(-5,4,10,3);
    ctx.fillStyle="#36b94b";
    ctx.fillRect(-2,-7,4,14);
    ctx.fillRect(-7,-1,14,2);
    ctx.fillStyle="#a1ef6f";ctx.fillRect(-1,-5,2,3);
  }
  ctx.restore();
}

function drawShot(s){
  ctx.fillStyle="#fff";
  ctx.fillRect(Math.round(s.x)-1,Math.round(s.y)-2,2,5);
}
function drawEnemyShot(s){
  ctx.fillStyle="#ffef5a";
  ctx.fillRect(Math.round(s.x)-1,Math.round(s.y)-1,3,3);
}
function drawParticles(){
  for(const p of particles){
    ctx.fillStyle=p.big?"#fff36b":"#ffd43b";
    const n=p.life>.35?2:1;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),n,n);
  }
}

function text(t,x,y,size=8,align="left"){
  ctx.font="bold "+size+"px monospace";
  ctx.textAlign=align;ctx.fillStyle="#fff";
  ctx.fillText(t,x,y);
}

function drawHud(){
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,320,16);
  text("SCORE "+String(score).padStart(6,"0"),5,11,7);
  text("WAVE "+wave,160,11,7,"center");
  text("♥".repeat(lives),315,11,7,"right");
  text("ENEMIES "+enemies.length+"/5",5,176,6);
}

function drawHome(){
  drawSky(.016);
  ctx.fillStyle="rgba(0,60,100,.28)";ctx.fillRect(28,22,264,120);
  ctx.strokeStyle="#111";ctx.lineWidth=3;ctx.strokeRect(28,22,264,120);

  text("HAMBO'S",160,52,22,"center");
  ctx.fillStyle="#fff";ctx.font="bold 11px monospace";ctx.textAlign="center";
  ctx.fillText("TIME FIGHTER",160,68);
  ctx.fillStyle="#111";ctx.fillRect(76,79,168,26);
  text("8-BIT AIR COMBAT",160,91,8,"center");
  text("TAP TO START",160,121,10,"center");
  text("MOVE: JOYSTICK   FIRE: RED BUTTON",160,135,5,"center");

  drawPlayerPreview(160,158);
}
function drawPlayerPreview(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle="#111";ctx.fillRect(-3,-9,6,18);ctx.fillRect(-8,-3,16,5);
  ctx.fillStyle="#fff";ctx.fillRect(-2,-8,4,16);ctx.fillRect(-7,-2,14,3);
  ctx.restore();
}

function drawOver(){
  drawSky(.016);
  ctx.fillStyle="rgba(0,30,60,.38)";ctx.fillRect(35,28,250,112);
  ctx.strokeStyle="#111";ctx.lineWidth=3;ctx.strokeRect(35,28,250,112);
  text("GAME OVER",160,60,18,"center");
  text("SCORE "+score,160,83,9,"center");
  text("WAVE "+wave,160,96,7,"center");
  text("TAP TO PLAY AGAIN",160,121,9,"center");
  text("TAP HOME CORNER TO RETURN",160,134,5,"center");
}

function draw(dt){
  if(state==="play"){
    drawSky(dt);
    for(const s of shots)drawShot(s);
    for(const s of enemyShots)drawEnemyShot(s);
    for(const e of enemies)drawEnemy(e);
    if(player.inv<=0 || Math.floor(player.inv*10)%2)drawPlayer();
    drawParticles();
    drawHud();
  }else if(state==="home"){
    drawHome();
  }else{
    drawOver();
  }
}

function canvasPoint(e){
  const r=c.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(VW/r.width),y:(e.clientY-r.top)*(VH/r.height)};
}

// Home / game canvas tapping.
c.addEventListener("pointerdown",e=>{
  e.preventDefault();
  initAudio();
  if(state!=="play") startGame();
});
c.addEventListener("pointerup",e=>e.preventDefault());
c.addEventListener("contextmenu",e=>e.preventDefault());

// Joystick
const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");
function setJoy(clientX,clientY){
  const r=joy.getBoundingClientRect();
  let dx=clientX-(r.left+r.width/2);
  let dy=clientY-(r.top+r.height/2);
  const max=26,m=Math.hypot(dx,dy);
  if(m>max){dx=dx/m*max;dy=dy/m*max}
  joystick.x=dx/max;joystick.y=dy/max;
  stick.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetJoy(){
  joystick.active=false;joystick.x=0;joystick.y=0;
  stick.style.transform="translate(0,0)";
}
joy.addEventListener("pointerdown",e=>{
  e.preventDefault();initAudio();joystick.active=true;joy.setPointerCapture(e.pointerId);setJoy(e.clientX,e.clientY);
});
joy.addEventListener("pointermove",e=>{if(joystick.active)setJoy(e.clientX,e.clientY)});
joy.addEventListener("pointerup",resetJoy);
joy.addEventListener("pointercancel",resetJoy);

// Fire button
const fire=document.getElementById("fire");
fire.addEventListener("pointerdown",e=>{
  e.preventDefault();initAudio();
  if(state!=="play"){startGame();return}
  fireHeld=true;shoot();
  fire.setPointerCapture(e.pointerId);
});
fire.addEventListener("pointerup",()=>fireHeld=false);
fire.addEventListener("pointercancel",()=>fireHeld=false);

// Desktop click starts game.
addEventListener("pointerdown",e=>{
  if(e.target===c && state!=="play")startGame();
});

function loop(t){
  const dt=Math.min(.033,(t-last)/1000||.016);
  last=t;
  update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
